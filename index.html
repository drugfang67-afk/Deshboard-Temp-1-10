<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สรุปการควบคุมอุณหภูมิ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --bg:#0F1B24; --panel:#152530; --panel-border:#22394A;
    --band:#1B4B4A; --band-border:#2E7D78;
    --mean:#5FD9CE; --minmax:#3E7C9A; --excursion:#F2704F;
    --text:#E8F1F0; --subtext:#FFFF33; --good:#5FD9CE; --grid:#1D3441;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 15% 0%, #16293380 0%, var(--bg) 55%);
    color:var(--text); font-family:'Inter','Noto Sans Thai',sans-serif;
    min-height:100vh; padding:28px 16px;
  }
  .wrap{max-width:880px;margin:0 auto;}
  .eyebrow{font-size:11px;letter-spacing:.12em;color:var(--subtext);text-transform:uppercase;margin-bottom:6px;}
  h1{font-size:26px;font-weight:700;margin:0 0 18px;}
  .fridge-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;background:var(--panel);border:1px solid var(--panel-border);
               border-radius:12px;padding:6px;}
  .fridge-tab{flex:1 1 72px;min-width:64px;padding:9px 10px;border-radius:8px;cursor:pointer;border:none;background:transparent;
              color:var(--subtext);font-weight:700;font-size:13px;text-align:center;font-family:inherit;
              transition:all .15s ease;}
  .fridge-tab.active{background:var(--mean);color:#0B1E1C;}
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:16px;}
  .card .label{font-size:11px;color:var(--subtext);margin-bottom:8px;line-height:1.3;}
  .card .value{font-size:24px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .card .sub{font-size:11px;color:var(--subtext);margin-top:2px;}
  .value.good{color:var(--good);}
  .value.bad{color:var(--excursion);}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{flex:1;padding:10px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--panel-border);
       background:var(--panel);color:var(--subtext);font-weight:600;font-size:14px;text-align:center;
       transition:all .15s ease;font-family:inherit;}
  .tab.active{border-color:var(--band-border);background:var(--band);color:var(--text);}
  .panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;padding:20px 18px 14px;margin-bottom:16px;}
  .panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;flex-wrap:wrap;gap:8px;}
  .panel-head .title{font-size:16px;font-weight:700;}
  .panel-head .count{font-size:12px;color:var(--subtext);font-family:'IBM Plex Mono',monospace;}
  .mini-stats{display:flex;gap:18px;margin-bottom:10px;flex-wrap:wrap;}
  .mini-stat .label{font-size:11px;color:var(--subtext);}
  .mini-stat .value{font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .chart-box{width:100%;}
  .chart-box svg{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--subtext);padding:10px 4px 4px;flex-wrap:wrap;}
  .legend .dot{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .swatch.line{width:14px;height:2px;border-radius:1px;}
  .excursion-box{background:#2A1712;border:1px solid #5C3324;border-radius:14px;padding:16px 18px;}
  .excursion-box .head{font-size:13px;font-weight:700;color:var(--excursion);margin-bottom:10px;
                        display:flex;justify-content:space-between;align-items:center;}
  .excursion-list{max-height:340px;overflow-y:auto;}
  .excursion-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-family:'IBM Plex Mono',monospace;
                 padding:6px 0;border-top:1px solid #5C332440;}
  .excursion-row:first-of-type{border-top:none;}
  .excursion-row .t{color:var(--excursion);font-weight:600;text-align:right;}
  .ok-box{background:#0F2A25;border:1px solid #1F5C4E;border-radius:14px;padding:14px 18px;
          font-size:13px;color:var(--good);font-weight:600;}
  .pt{cursor:pointer;}
  .pt:hover{opacity:0.85;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">บันทึกอุณหภูมิรายเดือน · เกณฑ์ปกติ 2–8°C</div>
  <h2>สรุปผลอุณหภูมิตู้เย็นแบบรายเดือน</h2>

  <div class="fridge-tabs" id="fridgeTabs"></div>

  <div class="summary-grid" id="summaryGrid"></div>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <div class="panel-head">
      <div class="title" id="monthTitle"></div>
      <div class="count" id="monthCount"></div>
    </div>
    <div class="mini-stats">
      <div class="mini-stat"><div class="label">ในเกณฑ์</div><div class="value" id="monthPct" style="color:var(--good)"></div></div>
      <div class="mini-stat"><div class="label">นอกเกณฑ์</div><div class="value" id="monthOut"></div></div>
    </div>
    <div class="chart-box" id="chartBox"></div>
    <div class="legend">
      <span class="dot"><span class="swatch" style="background:var(--band)"></span>ช่วงปกติ 2–8°C</span>
      <span class="dot"><span class="swatch" style="background:var(--minmax)"></span>ช่วงต่ำสุด–สูงสุดรายวัน</span>
      <span class="dot"><span class="swatch line" style="background:var(--mean)"></span>ค่าเฉลี่ยรายวัน</span>
    </div>
  </div>

  <div id="excursionArea"></div>
</div>

    daily: DAILY_FRIDGE10,
    months: META_FRIDGE10
  },
};

const COLORS = {
  band: "#1B4B4A", bandBorder: "#2E7D78", mean: "#5FD9CE",
  minmax: "#3E7C9A", excursion: "#F2704F", text: "#E8F1F0",
  subtext: "#8FAAB3", grid: "#1D3441"
};

let currentFridge = 'fridge1';
let currentMonthKey = '5-69';

// ---- fridge tabs ----
const fridgeTabsEl = document.getElementById('fridgeTabs');
Object.keys(FRIDGES).forEach(fk => {
  const btn = document.createElement('button');
  btn.className = 'fridge-tab';
  btn.textContent = FRIDGES[fk].label;
  btn.id = 'fridgetab-' + fk;
  btn.onclick = () => selectFridge(fk);
  fridgeTabsEl.appendChild(btn);
});

function renderSummary(fk){
  const months = FRIDGES[fk].months;
  const totals = months.reduce((acc, m) => {
    acc.total += m.total; acc.inRange += m.inRange; acc.outRange += m.outRange;
    return acc;
  }, { total: 0, inRange: 0, outRange: 0 });
  const overallPct = (totals.inRange / totals.total * 100).toFixed(3);
  document.getElementById('summaryGrid').innerHTML = `
    <div class="card">
      <div class="label">ค่าที่บันทึกทั้งหมด (3 เดือน)</div>
      <div class="value">${totals.total.toLocaleString()}</div>
      <div class="sub">รายการ</div>
    </div>
    <div class="card">
      <div class="label">อยู่ในเกณฑ์ปกติ</div>
      <div class="value good">${overallPct}%</div>
      <div class="sub">${totals.inRange.toLocaleString()} รายการ</div>
    </div>
    <div class="card">
      <div class="label">นอกเกณฑ์</div>
      <div class="value bad">${totals.outRange.toLocaleString()}</div>
      <div class="sub">รายการ ตลอด 3 เดือน</div>
    </div>
  `;
}

function renderMonthTabs(fk){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  FRIDGES[fk].months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.textContent = m.label;
    btn.onclick = () => selectMonth(fk, m.key);
    btn.id = 'tab-' + m.key;
    tabsEl.appendChild(btn);
  });
}

function selectFridge(fk){
  currentFridge = fk;
  Object.keys(FRIDGES).forEach(k => document.getElementById('fridgetab-'+k).classList.toggle('active', k === fk));
  renderSummary(fk);
  renderMonthTabs(fk);
  selectMonth(fk, FRIDGES[fk].months[0].key);
}

function fmtDay(dateStr){ return String(parseInt(dateStr.slice(-2),10)); }

function buildChartSVG(data, excursionDays){
  const W = 800, H = 280;
  const padL = 34, padR = 12, padT = 14, padB = 26;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const yMin = 0, yMax = 9;

  const n = data.length;
  const xAt = (i) => padL + (n === 1 ? plotW/2 : (i / (n - 1)) * plotW);
  const yAt = (v) => padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

  let gridLines = '';
  let yTicks = '';
  [0,2,4,6,8].forEach(v => {
    const y = yAt(v);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${COLORS.grid}" stroke-width="1" stroke-dasharray="3 4"/>`;
    yTicks += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${COLORS.subtext}" font-family="IBM Plex Mono, monospace">${v}</text>`;
  });

  let xTicks = '';
  const step = Math.max(1, Math.ceil(n / 8));
  for(let i=0;i<n;i+=step){
    const x = xAt(i);
    xTicks += `<text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="${COLORS.subtext}" font-family="IBM Plex Mono, monospace">${fmtDay(data[i].Date)}</text>`;
  }

  const bandTop = yAt(8), bandBottom = yAt(2);
  const bandRect = `<rect x="${padL}" y="${bandTop}" width="${plotW}" height="${bandBottom-bandTop}" fill="${COLORS.band}" fill-opacity="0.35"/>`;
  const bandLineTop = `<line x1="${padL}" y1="${bandTop}" x2="${W-padR}" y2="${bandTop}" stroke="${COLORS.bandBorder}" stroke-width="1" stroke-dasharray="4 3"/>`;
  const bandLineBottom = `<line x1="${padL}" y1="${bandBottom}" x2="${W-padR}" y2="${bandBottom}" stroke="${COLORS.bandBorder}" stroke-width="1" stroke-dasharray="4 3"/>`;

  const yClamp = (v) => Math.max(yMin, Math.min(yMax, v));

  let areaPts = '';
  for(let i=0;i<n;i++) areaPts += `${xAt(i)},${yAt(yClamp(data[i].max))} `;
  for(let i=n-1;i>=0;i--) areaPts += `${xAt(i)},${yAt(yClamp(data[i].min))} `;
  const areaPoly = `<polygon points="${areaPts.trim()}" fill="${COLORS.minmax}" fill-opacity="0.32" stroke="none"/>`;

  let meanPts = '';
  for(let i=0;i<n;i++) meanPts += `${xAt(i)},${yAt(yClamp(data[i].mean))} `;
  const meanLine = `<polyline points="${meanPts.trim()}" fill="none" stroke="${COLORS.mean}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;

  let markers = '';
  const exDaySet = new Set((excursionDays||[]));
  for(let i=0;i<n;i++){
    const day = parseInt(data[i].Date.slice(-2),10);
    if(exDaySet.has(day)){
      const hi = data[i].max > 8;
      const lo = data[i].min < 2;
      const val = hi ? data[i].max : data[i].min;
      const cx = xAt(i), cy = yAt(yClamp(val));
      markers += `<circle class="pt" cx="${cx}" cy="${cy}" r="4.5" fill="${COLORS.excursion}" stroke="#0F1B24" stroke-width="1.3"><title>${data[i].Date}: ${val}°C (นอกเกณฑ์)</title></circle>`;
    }
  }

  let hoverDots = '';
  for(let i=0;i<n;i++){
    const cx = xAt(i), cy = yAt(yClamp(data[i].mean));
    hoverDots += `<circle class="pt" cx="${cx}" cy="${cy}" r="8" fill="transparent"><title>วันที่ ${fmtDay(data[i].Date)}&#10;เฉลี่ย: ${data[i].mean}°C&#10;สูงสุด: ${data[i].max}°C&#10;ต่ำสุด: ${data[i].min}°C</title></circle>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    ${bandRect}${bandLineTop}${bandLineBottom}
    ${areaPoly}
    ${meanLine}
    ${yTicks}
    ${xTicks}
    ${hoverDots}
    ${markers}
  </svg>`;
}

function selectMonth(fk, key){
  currentFridge = fk;
  currentMonthKey = key;
  FRIDGES[fk].months.forEach(m => document.getElementById('tab-'+m.key).classList.toggle('active', m.key === key));
  const month = FRIDGES[fk].months.find(m => m.key === key);
  const data = FRIDGES[fk].daily[key];
  const pct = (month.inRange / month.total * 100).toFixed(2);

  document.getElementById('monthTitle').textContent = month.full;
  document.getElementById('monthCount').textContent = month.total.toLocaleString() + ' จุดข้อมูล';
  document.getElementById('monthPct').textContent = pct + '%';
  const outEl = document.getElementById('monthOut');
  outEl.textContent = month.outRange.toLocaleString() + ' รายการ';
  outEl.style.color = month.outRange > 0 ? COLORS.excursion : COLORS.subtext;

  const excursionDays = month.excursions.map(e => e.day);
  document.getElementById('chartBox').innerHTML = buildChartSVG(data, excursionDays);

  const area = document.getElementById('excursionArea');
  if(month.excursions.length > 0){
    const rows = month.excursions.map(e => {
      if(e.time){
        return `<div class="excursion-row"><span>${e.date} เวลา ${e.time}</span><span class="t">${e.temp} · ${e.dir}</span></div>`;
      }
      const countLabel = e.count > 1 ? ` (${e.count} ครั้ง)` : '';
      const rangeLabel = e.min === e.max ? `${e.min}°C` : `${e.min}–${e.max}°C`;
      return `<div class="excursion-row"><span>${e.date}${countLabel}</span><span class="t">${rangeLabel} · ${e.dir}</span></div>`;
    }).join('');
    area.innerHTML = `
      <div class="excursion-box">
        <div class="head"><span>⚠ จุดที่อุณหภูมินอกเกณฑ์</span><span>${month.outRange.toLocaleString()} รายการ</span></div>
        <div class="excursion-list">${rows}</div>
      </div>`;
  } else {
    area.innerHTML = `<div class="ok-box">✓ ไม่มีค่าอุณหภูมิที่นอกเกณฑ์ในเดือนนี้ ทุกจุดข้อมูลอยู่ในช่วง 2–8°C</div>`;
  }
}

selectFridge('fridge1');
</script>
